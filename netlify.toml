[build]
  base = "pet-sitter-angular"
  command = "npm run build"
  publish = "dist/pet-sitter-angular/browser"

[[redirects]]
  from = "/api/v1/*"
  to = "https://serotonine.alwaysdata.net/pet-sitter/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"