<mat-card-header>
    <mat-card-title>{{ customer()?.name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <dl>
      <dt>Email: </dt>
      <dd>{{customer()?.email}}</dd>
      <dt>Telephone: </dt>
      <dd>{{customer()?.tel}}</dd>
      <dt>Address: </dt>
      <dd>{{customer()?.address}}</dd>
    </dl>
  </mat-card-content>
