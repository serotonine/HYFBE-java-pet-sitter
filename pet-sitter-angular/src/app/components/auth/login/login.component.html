  <!-- Loggin -->
  <section class="loggin flex flex-col bg-olive-50 my-0 mx-auto mx-auto p-4 max-w-sm">
      <header class="text-center">
        <h2>Sign in to your account</h2>
      </header>
     
    <form [formGroup]="loginForm" class="flex flex-col" (ngSubmit)="login()">
      <mat-form-field class="mb-2">
        <mat-label>Email</mat-label>
        <input matInput name="email" type="email" formControlName="email" />
        <mat-error>
          @if (loginForm.get('email')?.hasError('required')) {Required Email.}
          @else if (loginForm.get('email')?.hasError('email')) {Invalid Email.}
        </mat-error>
      </mat-form-field>
      <mat-form-field class="mb-2">
        <mat-label>Password</mat-label>
        <input matInput name="password" [type]="isHidden() ? 'password' : 'text'" formControlName="password" />
        <button matSuffix mat-icon-button (click)="hide()">
          <mat-icon>{{isHidden() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error>Required Password.</mat-error>
      </mat-form-field>
      
      <button matButton="filled"  [disabled]= "loginForm.invalid" type="submit">Go!</button>
       @if(error()){
            <h3 class="text-red-500 text-center">{{error()}}</h3>
        }
    </form>
     <footer class="text-center">
        <p>Don't have an account?
          <a routerLink="/auth/register">Create one</a>.
        </p>
       
      </footer>
  </section>
