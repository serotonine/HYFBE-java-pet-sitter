<h2 mat-dialog-title>{{ data.title }}</h2>
    <mat-dialog-content>
     <app-pet-form [pet] = "data?.pet" (submitted)="onSubmit($event)"/>
    </mat-dialog-content>
    <mat-error>{{error()}}</mat-error>
    <mat-dialog-actions>
      <button mapButton="filled" (click)="close()">Cancel</button>
    </mat-dialog-actions>
