<dl>
  <dt>Name: </dt>
  <dd>{{_pet()?.name}}</dd>
  <dt>Breed: </dt>
  <dd>{{_pet()?.type?.name}}</dd>
  <dt>Age: </dt>
  <dd>{{_pet()?.age}}</dd>
  <dt>Comment: </dt>
  <dd>{{_pet()?.comment}}</dd>
</dl>
<button matButton="filled" (click)="updatePet()">Edit</button>
<button matButton="filled" (click)="deletePet(pet()?.id)">Delete</button>
